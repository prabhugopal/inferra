<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15203a"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#4f9eff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f9eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- full-bleed background; macOS applies its own rounded-square mask -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>

  <!-- three short, muted hops -->
  <g stroke="#4c5c82" stroke-width="24" stroke-linecap="round">
    <line x1="150" y1="540" x2="356" y2="540"/>
    <line x1="440" y1="540" x2="584" y2="540"/>
    <line x1="668" y1="540" x2="874" y2="540"/>
  </g>

  <!-- one bold shortcut, glow then solid -->
  <path d="M 150 540 Q 512 270 874 540" fill="none" stroke="#4f9eff" stroke-opacity="0.65"
        stroke-width="84" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M 150 540 Q 512 270 874 540" fill="none" stroke="#6bb4ff"
        stroke-width="42" stroke-linecap="round"/>

  <!-- four nodes -->
  <g>
    <circle cx="150" cy="540" r="74" fill="#7dc0ff"/>
    <circle cx="398" cy="540" r="62" fill="#0e1626" stroke="#7688b0" stroke-width="22"/>
    <circle cx="626" cy="540" r="62" fill="#0e1626" stroke="#7688b0" stroke-width="22"/>
    <circle cx="874" cy="540" r="74" fill="#7dc0ff"/>
  </g>
</svg>
