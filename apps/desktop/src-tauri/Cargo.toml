[package]
name = "inferra-desktop"
version.workspace = true
description = "Inferra desktop shell (Tauri + Svelte)"
authors = ["you"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inferra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json = "1"
inferra-app = { path = "../../../crates/inferra-app" }
inferra-core = { path = "../../../crates/inferra-core" }
inferra-gguf = { path = "../../../crates/inferra-gguf" }
inferra-hub = { path = "../../../crates/inferra-hub" }
inferra-mistral = { path = "../../../crates/inferra-mistral" }
inferra-ui-bridge = { path = "../../../crates/inferra-ui-bridge" }

[lints]
workspace = true
